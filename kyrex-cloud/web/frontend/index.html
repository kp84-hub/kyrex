<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyrex Cloud</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  h1 span { color: var(--text-dim); font-weight: 400; font-size: 0.85rem; }
  .auth-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
  .auth-bar .btn { margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px;
    font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); text-decoration: none; transition: 0.15s; }
  .btn:hover { background: #1c2128; border-color: var(--accent); }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: #1c2128; border-color: var(--red); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
  textarea, input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
    resize: vertical; outline: none; transition: 0.15s; }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); }
  .input-row { display: flex; gap: 8px; align-items: flex-start; }
  .input-row textarea { flex: 1; min-height: 60px; }
  .input-row .btn { margin-top: 2px; }

  /* Log area — single message updated in place */
  #log-area {
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; min-height: 80px; max-height: 300px; overflow-y: auto;
    font-family: "SF Mono", "Fira Code", "FiraMono", Menlo, Consolas, monospace;
    font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  #log-area .log-entry { color: var(--text-dim); }
  #log-area .log-entry .highlight { color: var(--accent); }
  #log-area .log-entry .tool { color: var(--green); }
  #log-area .log-entry .error { color: var(--red); }
  #log-area .log-entry .done { color: var(--green); font-weight: 600; }

  /* Approval prompt (Flux approval_requested events) */
  #approval-area .approval-box {
    border: 1px solid var(--yellow); border-radius: 6px; padding: 12px;
    background: #0d1117; display: flex; flex-direction: column; gap: 10px; }
  #approval-area .approval-title { font-size: 0.85rem; color: var(--yellow); font-weight: 600; }
  #approval-area .approval-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Loading indicator */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
    color: var(--text-dim); margin-top: 8px; }
  #status-indicator.idle { color: var(--text-dim); }
  #status-indicator.running { color: var(--accent); }
  #status-indicator.awaiting { color: var(--yellow); }

  /* Past results */
  .result-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .result-item:last-child { border-bottom: none; }
  .result-item .task-text { font-weight: 500; margin-bottom: 4px; }
  .result-item .meta { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .result-item .meta .status-ok { color: var(--green); }
  .result-item .meta .status-warn { color: var(--yellow); }
  .result-item .meta .status-err { color: var(--red); }
  .result-item .meta a { color: var(--accent); text-decoration: none; }
  .result-item .meta a:hover { text-decoration: underline; }
  .result-item .response { margin-top: 6px; font-size: 0.85rem; color: var(--text-dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Kyrex Cloud <span>web trigger</span></h1>

<div id="auth-bar" class="auth-bar">
  <span id="auth-status">Checking authentication...</span>
  <a id="auth-btn" href="/auth/login" class="btn">Sign in with GitHub</a>
</div>

<div id="task-section" class="hidden">
  <div class="card">
    <h2>Run a task</h2>
    <div class="input-row">
      <textarea id="task-input" placeholder="Describe what you want the agent to do..." enterkeyhint="send"></textarea>
      <button id="run-btn" class="btn btn-primary" onclick="submitTask()">Run</button>
      <button id="cancel-btn" class="btn btn-danger hidden" onclick="cancelTask()">Cancel</button>
    </div>
    <div id="status-indicator" class="idle">
      <span class="spinner hidden" id="spinner"></span>
      <span id="status-text">Idle</span>
    </div>
  </div>

  <div id="log-card" class="card hidden">
    <h2>Progress</h2>
    <div id="log-area"><div class="log-entry" id="log-entry"></div></div>
    <div id="approval-area" class="hidden" style="margin-top: 12px;"></div>
  </div>

  <div class="card">
    <h2>Past results</h2>
    <div id="results-list">
      <div style="color: var(--text-dim); font-size: 0.85rem;">Loading...</div>
    </div>
  </div>
</div>

<script>
// Flux (Phase 3): the page follows exactly one task over the durable,
// cursor-resumable SSE stream (/api/task/{id}/events, flux.py). The session
// cookie authenticates the stream — same-origin EventSource sends it, and the
// session cookie is HttpOnly, so there is deliberately no token in JS.
let eventSource = null;   // Flux stream for the followed task
let currentTaskId = null; // the task this page is following
let running = false;

// ── Auth ──────────────────────────────────────────────────────────

async function checkAuth() {
  try {
    const r = await fetch('/api/me');
    const data = await r.json();
    if (data.authenticated) {
      document.getElementById('auth-status').textContent = 'Signed in as ' + data.username;
      document.getElementById('auth-btn').textContent = 'Sign out';
      document.getElementById('auth-btn').href = '/auth/logout';
      document.getElementById('task-section').classList.remove('hidden');
      loadResults();
    } else {
      document.getElementById('auth-status').textContent = 'Not signed in';
      document.getElementById('auth-btn').textContent = 'Sign in with GitHub';
      document.getElementById('auth-btn').href = '/auth/login';
    }
  } catch (e) {
    document.getElementById('auth-status').textContent = 'Error checking auth';
  }
}

// ── Task submission ───────────────────────────────────────────────

async function submitTask() {
  if (running) return;
  const input = document.getElementById('task-input');
  const task = input.value.trim();
  if (!task) return;

  setRunning(true);
  document.getElementById('log-entry').textContent = '';
  hideApproval();
  appendLog('Submitting task...\n');

  try {
    const resp = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      appendLog('Error: ' + (err.detail || 'Unknown error') + '\n');
      setRunning(false);
      return;
    }
    const data = await resp.json();
    appendLog('Task queued (' + data.task_id + '). Following the live stream...\n');
    followTask(data.task_id);
  } catch (e) {
    appendLog('Error submitting task: ' + e.message + '\n');
    setRunning(false);
  }
}

// ── Flux stream (SSE) ─────────────────────────────────────────────
// The stream replays history from the cursor, tails live, and ends with an
// in-band `end` event carrying the final status. EventSource reconnects
// automatically with Last-Event-ID, so refreshes and drops lose nothing.

function followTask(taskId) {
  closeStream();
  currentTaskId = taskId;
  eventSource = new EventSource('/api/task/' + encodeURIComponent(taskId) + '/events');

  eventSource.addEventListener('start', (e) => appendLog(payloadOf(e).text + '\n'));
  eventSource.addEventListener('message', (e) => appendLog(payloadOf(e).text + '\n'));
  eventSource.addEventListener('edit', (e) => appendLog('  ✏️ ' + payloadOf(e).text + '\n'));
  eventSource.addEventListener('progress', (e) => renderProgress(payloadOf(e)));
  eventSource.addEventListener('status', (e) => setStatus(payloadOf(e).status));
  eventSource.addEventListener('result', (e) => showResult(payloadOf(e)));
  eventSource.addEventListener('approval_requested', (e) => showApproval(payloadOf(e)));
  eventSource.addEventListener('approval_resolved', (e) => {
    hideApproval();
    appendLog('Approval decided (' + (payloadOf(e).decision || '?') + ').\n');
  });
  eventSource.addEventListener('cancelled', () => hideApproval());
  eventSource.addEventListener('cancel_requested', () =>
    appendLog('Cancellation requested — the task stops at the next approval gate.\n'));
  eventSource.addEventListener('end', (e) => {
    closeStream();
    const p = payloadOf(e);
    if (p.reason === 'max_seconds_exceeded') {
      // The task keeps running; this page only stops following it.
      appendLog('\n(Stream follow timeout reached — the task keeps running. See Past results.)\n');
    }
    finishStream(p);
  });
  // `error` covers two cases: native connection failures (plain Event, no
  // data — EventSource retries on its own) and Flux's in-band error events
  // (MessageEvent with data — e.g. unknown_task, stream failure).
  eventSource.addEventListener('error', (e) => {
    if (!e.data) {
      if (eventSource && eventSource.readyState === EventSource.CLOSED) {
        appendLog('\n(Stream connection lost — the task keeps running. See Past results.)\n');
        finishStream({});
      }
      return;
    }
    const p = payloadOf(e);
    appendLog('Stream error: ' + (p.error || JSON.stringify(p)) + '\n');
    closeStream();
    finishStream({});
  });
}

function closeStream() {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
}

function finishStream(p) {
  hideApproval();
  if (p && p.status) appendLog('\n── Task ' + p.status + ' ──\n');
  setRunning(false);
  loadResults();
}

function payloadOf(e) {
  try {
    return JSON.parse(e.data);
  } catch (err) {
    return {};
  }
}

// ── Cancel ────────────────────────────────────────────────────────

async function cancelTask() {
  if (!currentTaskId || !running) return;
  try {
    const resp = await fetch('/api/task/' + encodeURIComponent(currentTaskId) + '/cancel',
      { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) {
      appendLog('Cancel failed: ' + (data.detail || resp.status) + '\n');
      return;
    }
    if (data.status === 'cancelled') {
      appendLog('Task cancelled.\n');
    } else {
      appendLog('Cancellation requested — the task stops at the next approval gate or finalisation.\n');
    }
  } catch (e) {
    appendLog('Cancel failed: ' + e.message + '\n');
  }
}

// ── Approvals ─────────────────────────────────────────────────────
// T1: a bare y/n decision. T2: the confirmation token — it is printed in the
// approval prompt in the log above (and deliberately not duplicated into this
// event payload, which any tab following the task can read).

function showApproval(p) {
  const area = document.getElementById('approval-area');
  area.textContent = '';

  const box = document.createElement('div');
  box.className = 'approval-box';

  const title = document.createElement('div');
  title.className = 'approval-title';
  title.textContent = (p.tier === 2 ? 'T2 approval required — ' : 'T1 approval required — ')
    + (p.summary || 'the agent needs your confirmation');
  box.appendChild(title);

  const actions = document.createElement('div');
  actions.className = 'approval-actions';
  if (p.tier === 2) {
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'approval-token';
    input.placeholder = 'Paste the confirmation token from the log';
    actions.appendChild(input);
    actions.appendChild(mkButton('Approve', () => respondApproval(input.value.trim())));
  } else {
    actions.appendChild(mkButton('Approve', () => respondApproval('y')));
    actions.appendChild(mkButton('Deny', () => respondApproval('n')));
  }
  box.appendChild(actions);
  area.appendChild(box);
  area.classList.remove('hidden');
  document.getElementById('log-card').classList.remove('hidden');
}

function mkButton(label, fn) {
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = label;
  b.onclick = fn;
  return b;
}

async function respondApproval(text) {
  if (!text) {
    appendLog('Approval reply is empty.\n');
    return;
  }
  try {
    const resp = await fetch('/api/task/' + encodeURIComponent(currentTaskId) + '/respond', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      appendLog('Approval reply failed: ' + (data.detail || resp.status) + '\n');
      return;
    }
    if (!data.delivered) {
      appendLog('No pending approval (already resolved or expired).\n');
    }
    hideApproval();
  } catch (e) {
    appendLog('Approval reply failed: ' + e.message + '\n');
  }
}

function hideApproval() {
  const area = document.getElementById('approval-area');
  area.textContent = '';
  area.classList.add('hidden');
}

// ── Live log (update in place, auto-scroll) ───────────────────────

function appendLog(text) {
  const entry = document.getElementById('log-entry');
  entry.textContent += text;
  const area = document.getElementById('log-area');
  area.scrollTop = area.scrollHeight;
  document.getElementById('log-card').classList.remove('hidden');
}

function renderProgress(note) {
  const p = note || {};
  let text = '';
  const lines = p.lines || [];
  for (const l of lines) {
    if (typeof l === 'string') {
      text += '  → ' + l + '\n';
    } else if (l.tool) {
      text += '  → 🛠 ' + l.tool + '\n';
    } else if (l.edit) {
      text += '  → ✏️ ' + l.edit + '\n';
    } else if (l.confirm) {
      text += '  → ✓ ' + l.confirm + '\n';
    } else if (l.error) {
      text += '  → ⚠️ ' + l.error + '\n';
    } else {
      text += '  → ' + JSON.stringify(l) + '\n';
    }
  }
  if (!lines.length) {
    if (p.tool) {
      text += '  → 🛠 ' + p.tool + '\n';
    } else if (p.note) {
      text += '  → ' + p.note + '\n';
    } else if (Object.keys(p).length) {
      text += '  → ' + JSON.stringify(p) + '\n';
    }
  }
  if (text) appendLog(text);
}

function setStatus(status) {
  const statusText = document.getElementById('status-text');
  const indicator = document.getElementById('status-indicator');
  if (status === 'awaiting_approval') {
    statusText.textContent = 'Waiting for your approval...';
    indicator.className = 'awaiting';
  } else if (status === 'queued') {
    statusText.textContent = 'Queued...';
    indicator.className = 'running';
  } else if (status === 'running') {
    statusText.textContent = 'Task running...';
    indicator.className = 'running';
  } else if (status) {
    statusText.textContent = 'Status: ' + status;
    indicator.className = 'running';
  }
}

function showResult(p) {
  let text = '\n── Result ──\n';
  text += 'Status: ' + (p.status || 'unknown') + '\n';
  const pr = (p.pull_request && p.pull_request.url) || p.pr_url;
  if (pr) {
    text += 'PR: ' + pr + '\n';
  }
  if (p.final_response) {
    text += 'Response: ' + p.final_response + '\n';
  }
  if (p.errors && p.errors.length) {
    text += 'Errors: ' + p.errors.join('; ') + '\n';
  }
  appendLog(text);
}

function setRunning(v) {
  running = v;
  const btn = document.getElementById('run-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('status-text');
  const indicator = document.getElementById('status-indicator');
  btn.disabled = v;
  cancelBtn.classList.toggle('hidden', !v);
  if (v) {
    spinner.classList.remove('hidden');
    statusText.textContent = 'Task running...';
    indicator.className = 'running';
  } else {
    spinner.classList.add('hidden');
    statusText.textContent = 'Idle';
    indicator.className = 'idle';
  }
}

// ── Past results ──────────────────────────────────────────────────

async function loadResults() {
  try {
    const r = await fetch('/api/results');
    const data = await r.json();
    const list = document.getElementById('results-list');
    const items = data.results || [];
    if (items.length === 0) {
      list.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">No results yet.</div>';
      return;
    }
    list.innerHTML = items.map(r => {
      let statusClass = 'status-ok';
      if (r.status === 'no_changes' || r.status === 'error' || r.status === 'agent_failed') {
        statusClass = 'status-err';
      } else if (r.status === 'review_flagged') {
        statusClass = 'status-warn';
      }
      const statusLabel = r.status.replace(/_/g, ' ');
      const prLink = r.pr_url ? '<a href="' + r.pr_url + '" target="_blank">PR ↗</a>' : '';
      const resp = r.final_response ? '<div class="response">' + escapeHtml(r.final_response.substring(0, 200)) + '</div>' : '';
      return '<div class="result-item">' +
        '<div class="task-text">' + escapeHtml(r.task) + '</div>' +
        '<div class="meta">' +
          '<span class="' + statusClass + '">' + statusLabel + '</span>' +
          prLink +
          '<span>' + (r.finished_at ? new Date(r.finished_at).toLocaleString() : '') + '</span>' +
        '</div>' +
        resp +
        '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('results-list').innerHTML = '<div style="color: var(--red); font-size: 0.85rem;">Failed to load results.</div>';
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ── Enter-to-send (desktop Enter / mobile Send key) ───────────────

const taskInput = document.getElementById('task-input');
taskInput.addEventListener('keydown', (e) => {
  // Submit on Enter, but allow newline with Shift+Enter.
  // e.isComposing guards against firing mid-IME-composition (mobile keyboards).
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submitTask();
  }
});

// ── Init ──────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
