<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyrex Cloud</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  h1 span { color: var(--text-dim); font-weight: 400; font-size: 0.85rem; }
  .auth-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
  .auth-bar .btn { margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px;
    font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); text-decoration: none; transition: 0.15s; }
  .btn:hover { background: #1c2128; border-color: var(--accent); }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: #1c2128; border-color: var(--red); }
  .btn-small { padding: 3px 10px; font-size: 0.78rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
  textarea, input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
    resize: vertical; outline: none; transition: 0.15s; }
  textarea:focus, input[type="text"]:focus { border-color: var(--accent); }
  .input-row { display: flex; gap: 8px; align-items: flex-start; }
  .input-row textarea { flex: 1; min-height: 60px; }
  .input-row .btn { margin-top: 2px; }

  /* Log area — single message updated in place */
  #log-area {
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; min-height: 80px; max-height: 300px; overflow-y: auto;
    font-family: "SF Mono", "Fira Code", "FiraMono", Menlo, Consolas, monospace;
    font-size: 0.8rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  #log-area .log-entry { color: var(--text-dim); }
  #log-area .log-entry .highlight { color: var(--accent); }
  #log-area .log-entry .tool { color: var(--green); }
  #log-area .log-entry .error { color: var(--red); }
  #log-area .log-entry .done { color: var(--green); font-weight: 600; }

  /* Approval reply box — appears while a task is awaiting_approval */
  #approval-box { margin-top: 12px; padding: 12px; border: 1px solid var(--yellow);
    border-radius: 6px; background: rgba(210, 153, 34, 0.08); }
  #approval-box .approval-summary { font-size: 0.85rem; margin-bottom: 8px; color: var(--text); }
  #approval-box .approval-row { display: flex; gap: 8px; align-items: center; }
  #approval-box input[type="text"] { flex: 1; font-family: inherit; }

  /* Loading indicator */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
    color: var(--text-dim); margin-top: 8px; }
  #status-indicator.idle { color: var(--text-dim); }
  #status-indicator.running { color: var(--accent); }

  /* Past results */
  .result-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .result-item:last-child { border-bottom: none; }
  .result-item .task-text { font-weight: 500; margin-bottom: 4px; }
  .result-item .meta { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .result-item .meta .status-ok { color: var(--green); }
  .result-item .meta .status-warn { color: var(--yellow); }
  .result-item .meta .status-err { color: var(--red); }
  .result-item .meta .status-live { color: var(--accent); }
  .result-item .meta a { color: var(--accent); text-decoration: none; }
  .result-item .meta a:hover { text-decoration: underline; }
  .result-item .response { margin-top: 6px; font-size: 0.85rem; color: var(--text-dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Kyrex Cloud <span>web trigger</span></h1>

<div id="auth-bar" class="auth-bar">
  <span id="auth-status">Checking authentication...</span>
  <a id="auth-btn" href="/auth/login" class="btn">Sign in with GitHub</a>
</div>

<div id="task-section" class="hidden">
  <div class="card">
    <h2>Run a task</h2>
    <div class="input-row">
      <textarea id="task-input" placeholder="Describe what you want the agent to do..." enterkeyhint="send"></textarea>
      <button id="run-btn" class="btn btn-primary" onclick="submitTask()">Run</button>
    </div>
    <div id="status-indicator" class="idle">
      <span class="spinner hidden" id="spinner"></span>
      <span id="status-text">Idle</span>
      <button id="cancel-btn" class="btn btn-danger btn-small hidden" onclick="cancelTask()">Cancel</button>
    </div>
  </div>

  <div id="log-card" class="card hidden">
    <h2>Progress</h2>
    <div id="log-area"><div class="log-entry" id="log-entry"></div></div>
    <div id="approval-box" class="hidden">
      <div class="approval-summary" id="approval-summary"></div>
      <div class="approval-row">
        <input type="text" id="approval-text" placeholder="Reply (y / n, or the confirmation token for T2)">
        <button id="approval-send" class="btn btn-small" onclick="sendApprovalReply()">Reply</button>
        <button id="approval-yes" class="btn btn-small btn-primary" onclick="sendApprovalReply('y')">Approve</button>
        <button id="approval-no" class="btn btn-small btn-danger" onclick="sendApprovalReply('n')">Deny</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Past results</h2>
    <div id="results-list">
      <div style="color: var(--text-dim); font-size: 0.85rem;">Loading...</div>
    </div>
  </div>
</div>

<script>
// ── Flux event stream ─────────────────────────────────────────────
// Live progress comes from the Flux SSE endpoint (GET /api/task/{id}/events),
// backed by the durable task_events table. The browser EventSource resumes
// from its Last-Event-ID automatically, so a dropped connection replays
// nothing twice and misses nothing. The stream ends with an `end` event
// carrying the task's final status.

let sessionToken = null;
let eventSource = null;   // live EventSource for the current task
let currentTaskId = null; // task the log area is following
let running = false;

// Every event type the backend can put on the wire (task_store.add_event
// call sites + flux.py synthetic end/error). test_flux_frontend.py checks
// this list against the store so the two cannot drift apart.
const FLUX_EVENT_TYPES = [
  'submitted', 'claimed', 'status', 'start', 'message', 'edit',
  'approval_requested', 'approval_resolved', 'progress', 'result',
  'end', 'error',
];

const ACTIVE_STATUSES = ['queued', 'running', 'awaiting_approval'];

// ── Auth ──────────────────────────────────────────────────────────

async function checkAuth() {
  try {
    const r = await fetch('/api/me');
    const data = await r.json();
    if (data.authenticated) {
      sessionToken = document.cookie.split('; ').find(c => c.startsWith('session='))?.split('=')[1] || null;
      document.getElementById('auth-status').textContent = 'Signed in as ' + data.username;
      document.getElementById('auth-btn').textContent = 'Sign out';
      document.getElementById('auth-btn').href = '/auth/logout';
      document.getElementById('task-section').classList.remove('hidden');
      loadResults();
    } else {
      document.getElementById('auth-status').textContent = 'Not signed in';
      document.getElementById('auth-btn').textContent = 'Sign in with GitHub';
      document.getElementById('auth-btn').href = '/auth/login';
    }
  } catch (e) {
    document.getElementById('auth-status').textContent = 'Error checking auth';
  }
}

// ── Task submission ───────────────────────────────────────────────

async function submitTask() {
  if (running) return;
  const input = document.getElementById('task-input');
  const task = input.value.trim();
  if (!task) return;

  setRunning(true);
  resetLog();
  appendLog('Submitting task...\n');

  try {
    const resp = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      appendLog('Error: ' + (err.detail || 'Unknown error') + '\n');
      setRunning(false);
      return;
    }
    const data = await resp.json();
    appendLog('Task queued (' + data.task_id + '). Following the Flux stream...\n');
    followTask(data.task_id);
  } catch (e) {
    appendLog('Error submitting task: ' + e.message + '\n');
    setRunning(false);
  }
}

// ── Flux stream (SSE) ─────────────────────────────────────────────

function followTask(taskId) {
  closeStream();
  currentTaskId = taskId;
  document.getElementById('log-card').classList.remove('hidden');
  document.getElementById('cancel-btn').classList.remove('hidden');

  // Same-origin EventSource sends the session cookie; no ?session= needed.
  const es = new EventSource('/api/task/' + encodeURIComponent(taskId) + '/events');
  eventSource = es;

  // Named listeners for every backend event type. The cursor advances via
  // the `id:` lines automatically (Last-Event-ID on reconnect).
  for (const type of FLUX_EVENT_TYPES) {
    es.addEventListener(type, (e) => handleFluxEvent(type, e));
  }

  // Transport-level errors dispatch a data-less 'error' event. EventSource
  // retries on its own with Last-Event-ID, so just note it — unless the
  // stream also failed server-side (named event carries data).
  es.onerror = function(e) {
    if (running) {
      appendLog('· connection interrupted, Flux will resume from the last cursor ·\n');
    }
  };
}

function closeStream() {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
  hideApprovalBox();
}

function handleFluxEvent(type, e) {
  let p = {};
  if (e.data) {
    try { p = JSON.parse(e.data); } catch (err) { p = { raw: e.data }; }
  }

  switch (type) {
    case 'submitted':
      appendLog('· queued (' + (p.executor_prefix || 'repo') + ' executor)\n');
      break;
    case 'claimed':
      appendLog('· claimed by worker\n');
      break;
    case 'status':
      if (p.status) {
        document.getElementById('status-text').textContent = 'Status: ' + p.status.replace(/_/g, ' ');
      }
      break;
    case 'start':
      appendLog((p.text || '') + '\n');
      break;
    case 'message':
      if (p.text) appendLog(p.text + '\n');
      break;
    case 'edit':
      // In-place status edits replace the trailing progress block.
      if (p.text) updateProgressBlock(p.text);
      break;
    case 'progress':
      appendProgressNote(p);
      break;
    case 'approval_requested':
      showApprovalBox(p);
      break;
    case 'approval_resolved':
      appendLog('· approval ' + (p.decision || '(resolved)') + '\n');
      hideApprovalBox();
      break;
    case 'result':
      renderResult(p);
      break;
    case 'end':
      // Explicit in-band termination. Synthetic events carry no id, so the
      // cursor never advanced past real history — safe to close here.
      appendLog('\n── Stream end · status: ' + (p.status === null || p.status === undefined ? 'unknown' : p.status)
        + (p.reason ? ' (' + p.reason + ')' : '') + ' ──\n');
      finishTask();
      break;
    case 'error':
      // Named stream error (unknown task, stream failure) — has data.
      appendLog('Error: ' + (p.error || 'stream failure') + '\n');
      if (p.error === 'unknown_task') finishTask();
      break;
    default:
      appendLog('· ' + JSON.stringify(p) + '\n');
  }
  autoScroll();
}

// ── Live log rendering ────────────────────────────────────────────

function resetLog() {
  document.getElementById('log-entry').textContent = '';
  hideApprovalBox();
}

function appendLog(text) {
  const entry = document.getElementById('log-entry');
  entry.textContent += text;
  autoScroll();
}

function autoScroll() {
  const area = document.getElementById('log-area');
  area.scrollTop = area.scrollHeight;
}

// Executor progress notes are rendered as arrow lines, matching the
// Telegram transport's presentation.
function appendProgressNote(p) {
  let text = '';
  const keys = Object.keys(p || {});
  if (keys.length === 0) return;
  if (p.tool) {
    text += '  → 🛠 ' + p.tool;
    if (p.step) text += ' · ' + p.step;
    text += '\n';
  } else if (p.edit) {
    text += '  → ✏️ ' + p.edit + '\n';
  } else if (p.confirm) {
    text += '  → ✓ ' + p.confirm + '\n';
  } else if (p.error) {
    text += '  → ⚠️ ' + p.error + '\n';
  } else {
    for (const k of keys) {
      text += '  → ' + k + ': ' + JSON.stringify(p[k]) + '\n';
    }
  }
  appendLog(text);
}

// `edit` events replace the live status block; keep the most recent one at
// the end of the log instead of stacking duplicates.
function updateProgressBlock(text) {
  const entry = document.getElementById('log-entry');
  const marker = '── live ──';
  const current = entry.textContent;
  const idx = current.indexOf(marker);
  if (idx !== -1) {
    entry.textContent = current.slice(0, idx) + marker + '\n' + text + '\n';
  } else {
    entry.textContent = current + '\n' + marker + '\n' + text + '\n';
  }
}

function renderResult(p) {
  let text = '\n── Result ──\n';
  text += 'Status: ' + (p.status || 'unknown') + '\n';
  if (p.branch) text += 'Branch: ' + p.branch + '\n';
  const prUrl = p.pull_request && p.pull_request.url;
  if (prUrl) text += 'PR: ' + prUrl + '\n';
  if (p.final_response) text += 'Response: ' + p.final_response + '\n';
  if (p.errors && p.errors.length) text += 'Errors: ' + p.errors.join('; ') + '\n';
  appendLog(text);
}

function finishTask() {
  closeStream();
  currentTaskId = null;
  setRunning(false);
  loadResults();
}

// ── Approvals ─────────────────────────────────────────────────────

let pendingApprovalTier = null;

function showApprovalBox(p) {
  pendingApprovalTier = p.tier;
  const box = document.getElementById('approval-box');
  const summary = document.getElementById('approval-summary');
  const yes = document.getElementById('approval-yes');
  const no = document.getElementById('approval-no');
  const input = document.getElementById('approval-text');
  summary.textContent = '⛔ Approval needed (T' + (p.tier !== undefined ? p.tier : '?') + '): '
    + (p.summary || 'the agent is waiting for your decision')
    + (p.tier >= 2 ? ' — type the confirmation token exactly as requested above.' : '');
  // Quick y/n buttons only for T1; T2 requires the typed token so
  // muscle-memory approval is impossible (K_BOT_DESIGN.md).
  yes.classList.toggle('hidden', p.tier !== 1);
  no.classList.toggle('hidden', p.tier !== 1);
  input.value = '';
  box.classList.remove('hidden');
  input.focus();
}

function hideApprovalBox() {
  pendingApprovalTier = null;
  document.getElementById('approval-box').classList.add('hidden');
}

async function sendApprovalReply(fixedText) {
  if (!currentTaskId) return;
  const input = document.getElementById('approval-text');
  const text = (fixedText !== undefined ? fixedText : input.value).trim();
  if (!text) return;
  try {
    const resp = await fetch('/api/task/' + encodeURIComponent(currentTaskId) + '/respond', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      appendLog('Reply rejected: ' + (err.detail || 'unknown error') + '\n');
      return;
    }
    appendLog('· reply sent: ' + (fixedText !== undefined ? fixedText : text) + '\n');
    input.value = '';
  } catch (e) {
    appendLog('Error sending reply: ' + e.message + '\n');
  }
}

// ── Cancellation ──────────────────────────────────────────────────

async function cancelTask() {
  if (!currentTaskId) return;
  try {
    const resp = await fetch('/api/task/' + encodeURIComponent(currentTaskId) + '/cancel', {
      method: 'POST',
    });
    const data = await resp.json();
    appendLog('· cancel ' + (data.requested ? 'requested' : 'not possible (task already finished)')
      + (data.status ? ' · status: ' + data.status : '') + '\n');
  } catch (e) {
    appendLog('Error requesting cancellation: ' + e.message + '\n');
  }
}

// ── Running state ─────────────────────────────────────────────────

function setRunning(v) {
  running = v;
  const btn = document.getElementById('run-btn');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('status-text');
  const indicator = document.getElementById('status-indicator');
  const cancelBtn = document.getElementById('cancel-btn');
  btn.disabled = v;
  cancelBtn.classList.toggle('hidden', !v);
  if (v) {
    spinner.classList.remove('hidden');
    statusText.textContent = 'Task running...';
    indicator.className = 'running';
  } else {
    spinner.classList.add('hidden');
    statusText.textContent = 'Idle';
    indicator.className = 'idle';
  }
}

// ── Past results ──────────────────────────────────────────────────

async function loadResults() {
  try {
    const r = await fetch('/api/results');
    const data = await r.json();
    const list = document.getElementById('results-list');
    const items = data.results || [];
    if (items.length === 0) {
      list.innerHTML = '<div style="color: var(--text-dim); font-size: 0.85rem;">No results yet.</div>';
      return;
    }
    list.innerHTML = items.map(r => {
      let statusClass = 'status-ok';
      if (r.status === 'no_changes' || r.status === 'error' || r.status === 'agent_failed') {
        statusClass = 'status-err';
      } else if (r.status === 'review_flagged') {
        statusClass = 'status-warn';
      } else if (ACTIVE_STATUSES.includes(r.status)) {
        statusClass = 'status-live';
      }
      const statusLabel = r.status.replace(/_/g, ' ');
      const prLink = r.pr_url ? '<a href="' + r.pr_url + '" target="_blank">PR ↗</a>' : '';
      const resp = r.final_response ? '<div class="response">' + escapeHtml(r.final_response.substring(0, 200)) + '</div>' : '';
      return '<div class="result-item">' +
        '<div class="task-text">' + escapeHtml(r.task) + '</div>' +
        '<div class="meta">' +
          '<span class="' + statusClass + '">' + statusLabel + '</span>' +
          prLink +
          '<span>' + (r.finished_at ? new Date(r.finished_at).toLocaleString() : '') + '</span>' +
        '</div>' +
        resp +
        '</div>';
    }).join('');

    // Flux resume: if a task is still active (e.g. the page was reloaded
    // mid-run, or the tab reconnects), reattach to its stream. Full
    // replay from cursor 0 rebuilds the log exactly — the store is the
    // source of truth, not what this tab happened to see.
    const active = items.find(r => ACTIVE_STATUSES.includes(r.status));
    if (active && active.task_id && !running) {
      setRunning(true);
      resetLog();
      appendLog('Reattached to running task (' + active.task_id + ') — replaying from the store...\n');
      followTask(active.task_id);
    }
  } catch (e) {
    document.getElementById('results-list').innerHTML = '<div style="color: var(--red); font-size: 0.85rem;">Failed to load results.</div>';
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ── Enter-to-send (desktop Enter / mobile Send key) ───────────────

const taskInput = document.getElementById('task-input');
taskInput.addEventListener('keydown', (e) => {
  // Submit on Enter, but allow newline with Shift+Enter.
  // e.isComposing guards against firing mid-IME-composition (mobile keyboards).
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submitTask();
  }
});

const approvalInput = document.getElementById('approval-text');
approvalInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    sendApprovalReply();
  }
});

// ── Init ──────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
