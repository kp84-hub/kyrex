name: Check job contracts
on:
  pull_request:
    paths:
      - 'kyrex-cloud/**'
      - 'kyrex_engine/**'
      - '.github/workflows/check-job-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend
      KYREX_DATA_DIR: /tmp/kyrex-job-contract-checks
      WEB_SESSION_SECRET: job-contract-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and runtime dependencies
        run: >-
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn
          websockets cryptography 'Pillow>=12.0,<13' playwright google-api-python-client
          google-auth-oauthlib google-auth-httplib2 google-cloud-firestore
      - name: Check general clarification, waiting and conversation continuity
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex_engine/tests/test_completion.py
          kyrex-cloud/web/backend/test_chat_natural.py
      - name: Check private image uploads and Groq specialist execution
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_vision.py
          kyrex-cloud/web/backend/test_research_completion.py
          kyrex-cloud/web/backend/test_coordinator_returns.py
          kyrex-cloud/web/backend/test_chat_maps.py
          kyrex_engine/tests/test_groq_vision.py
      - name: Check job boundaries and routing regressions
        run: |
          python -m compileall -q kyrex-cloud/job_contracts.py kyrex-cloud/task_store.py kyrex-cloud/delegation.py kyrex-cloud/serve.py kyrex-cloud/web/backend/chat_service.py
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q kyrex-cloud/web/backend/test_job_contracts.py kyrex-cloud/test_level6_preview_routing.py kyrex-cloud/test_level6_message_schedule.py kyrex-cloud/web/backend/test_level6_scheduled_preview.py kyrex-cloud/test_messages_conversations.py kyrex-cloud/web/backend/test_delegation_chat.py kyrex-cloud/test_delegation_gmail_shared_tool.py kyrex-cloud/test_delegation_calendar.py kyrex-cloud/test_delegation_level6_calendar.py kyrex-cloud/web/backend/test_shared_calendar_tools.py kyrex-cloud/web/backend/test_calendar_language_updates.py kyrex-cloud/test_calendar_writer.py kyrex-cloud/web/backend/test_delegation_approve.py kyrex-cloud/web/backend/test_mail_routing_bridge.py kyrex-cloud/web/backend/test_jev_connected_tool_routing.py
      - name: Check parallel Jev routing, cancellation and owner isolation offline
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_jev_routing.py
          kyrex-cloud/web/backend/test_jev_bot_routing_control_plane.py
          kyrex-cloud/web/backend/test_jev_connected_tool_routing.py
          kyrex-cloud/web/backend/test_jev_runtime_guards.py
          kyrex-cloud/web/backend/test_jev_parallel_routing.py
          kyrex_engine/tests/test_jev.py
          -k 'not live_smoke'
      - name: Check Jev gateway against its loopback fake provider
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          automation/test_jev_router.py
      - name: Check remote MCP transport, tenant isolation and engine mediation
        run: >-
          python -m pytest -q kyrex_engine/tests/test_remote_mcp.py
          kyrex-cloud/web/backend/test_remote_mcp_connections.py
          kyrex-cloud/web/backend/test_mcp_turn_recovery.py
          kyrex-cloud/web/backend/test_chat_failure_paths.py
      - name: Check Calendar week intent and local ranges
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_calendar_week_ranges.py
          kyrex-cloud/test_calendar_natural_language.py
          kyrex-cloud/test_calendar_agenda_format.py
      - name: Check account onboarding and provider isolation
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_chat_onboarding.py
          kyrex-cloud/web/backend/test_bot_model_check.py
          kyrex-cloud/web/backend/test_provider_profile_edit.py
          kyrex-cloud/web/backend/test_bot_provider_profile.py
          kyrex-cloud/web/backend/test_bot_create.py
          kyrex-cloud/web/backend/test_provider_profile_chat_api.py
      - name: Check manual workout preview retries
        run: python -m pytest --confcutdir=kyrex-cloud/web/backend -q kyrex-cloud/web/backend/test_level6_preview_run_now.py kyrex-cloud/web/backend/test_workout_message_followup.py kyrex-cloud/web/backend/test_messages_send.py
      - name: Check email notification setup and follow-ups
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_email_automation_chat.py
          kyrex-cloud/web/backend/test_email_notify_followup.py
          kyrex-cloud/web/backend/test_automation_api.py
      - name: Check natural mail request intent
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_chat_gmail_bridge.py
          -k 'natural_gmail_command or incidental_mail_terms or developer_plan_revision'
      - name: Check developer progress and completion
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_developer_workspace.py
          kyrex-cloud/test_developer_completion.py
          kyrex-cloud/test_developer_github_reads.py
          kyrex-cloud/web/backend/test_developer_progress_chat.py
          kyrex-cloud/web/backend/test_developer_delegation_conversations.py
          kyrex-cloud/web/backend/test_chat_bot_task_routing.py
      - name: Check bounded developer tools and write review
        run: >-
          python -m pytest -q kyrex_engine/tests/test_developer_tool_recovery.py
          kyrex_engine/tests/test_command_write_gate.py
          kyrex_engine/tests/test_run_command_security.py
      - name: Check connected GitHub reads and file pagination
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_github_connection.py
          kyrex-cloud/test_github_app.py
          kyrex-cloud/web/backend/test_github_chat.py
      - name: Check connected developer checkout and reviewed PR publishing
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_developer_repositories.py
          kyrex-cloud/web/backend/test_developer_repository_api.py
          kyrex-cloud/web/backend/test_github_app_api.py
          kyrex-cloud/web/backend/test_dev_bot_execution.py
          kyrex-cloud/web/backend/test_bot_dev_config.py
      - name: Check Bot roster repository discovery
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_chat_bots.py -k 'get_api_bots'
      - name: Check Glofox trainer monitoring and fixed group delivery
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_level6_trainer_monitor.py
          kyrex-cloud/web/backend/test_level6_trainer_reader.py
          kyrex-cloud/web/backend/test_level6_trainer_api.py
          kyrex-cloud/web/backend/test_level6_trainer_sender.py
          kyrex-cloud/test_google_messages_level6.py
          kyrex-cloud/test_level6_profile_dispatch.py
      - name: Check existing weekly Glofox reader
        run: python kyrex-cloud/test_glofox_api.py
      - name: Check dedicated inbox isolation and email source changes
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_agent_inbox.py
          kyrex-cloud/web/backend/test_email_identity.py
          kyrex-cloud/web/backend/test_email_send.py
          kyrex-cloud/web/backend/test_zoho_send.py
          kyrex_engine/tests/test_email_draft_tool.py
          kyrex-cloud/test_zoho_inbox.py
          kyrex-cloud/web/backend/test_email_inbox_api.py
          kyrex-cloud/web/backend/test_gmail_connections_api.py
          kyrex-cloud/web/backend/test_gmail_continuation_bridge.py
          kyrex-cloud/web/backend/test_gmail_inline_result_bridge.py
          kyrex-cloud/web/backend/test_automation_api.py
      - name: Check model request privacy
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex_engine/tests/test_provider_privacy.py
          kyrex-cloud/web/backend/test_chat_privacy.py
          kyrex-cloud/web/backend/test_gmail_inline_result_bridge.py
      - name: Check OpenCode protocols and signed Gemini tool history
        run: >-
          python -m pytest -q
          kyrex_engine/tests/test_opencode_gemini.py
          kyrex_engine/tests/test_opencode_go_responses.py
          kyrex_engine/tests/test_opencode_go_profile.py
          kyrex_engine/tests/test_opencode_session.py
          kyrex_engine/tests/test_opencode_message_normalization.py
          kyrex_engine/tests/test_provider_completion.py
      - name: Check Google connection renewal
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_connector_refresh.py
          kyrex-cloud/web/backend/test_google_connection_refresh.py
      - name: Check workout metrics and fitness boundaries
        run: >-
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_fitness_connections.py
          kyrex-cloud/web/backend/test_fitness_profile.py
          kyrex-cloud/test_workout_metrics.py
          kyrex-cloud/test_workout_request.py
          kyrex-cloud/test_sleep_report.py
          kyrex-cloud/web/backend/test_fitness_api.py
          kyrex-cloud/web/backend/test_fitness_delegation.py
          kyrex-cloud/web/backend/test_chat_bot_policy.py
          kyrex-cloud/web/backend/test_chat_bots.py
          kyrex_engine/tests/test_github_host_tool.py
          kyrex_engine/tests/test_bot_prompt_refresh.py
      - name: Check delegation, calendar relay, and worker concurrency
        run: |
          python kyrex-cloud/test_delegation_level6_message.py
          python kyrex-cloud/test_calendar_result_relay.py
          python kyrex-cloud/test_worker_concurrency.py
