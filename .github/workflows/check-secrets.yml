name: Check repository secrets
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Reject sensitive filenames, including forced additions
        run: python3 scripts/check_sensitive_paths.py
      - name: Verify the safeguards reject synthetic credentials
        run: python3 -m unittest discover -s scripts/tests -p 'test_credential_hygiene.py' -v
      - name: Scan checked-out files
        run: gitleaks dir --config=.gitleaks.toml --redact=100 --ignore-gitleaks-allow --no-banner .
      - name: Scan reachable Git history
        run: gitleaks git --config=.gitleaks.toml --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner .
