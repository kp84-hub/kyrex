name: Build Kyrex IDE (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "kyrex-ide-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build engine binary with PyInstaller
        working-directory: kyrex_engine
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv build_venv
          .\build_venv\Scripts\Activate.ps1
          pip install "setuptools<81"
          pip install -e .
          pip install pyinstaller
          pyinstaller --onefile --name kyrex-engine --collect-all openai --collect-all anthropic --collect-all tiktoken core_bridge.py

      - name: Print PyInstaller warnings
        working-directory: kyrex_engine
        run: |
          Get-Content build\kyrex-engine\warn-kyrex-engine.txt

      - name: Verify engine binary works
        working-directory: kyrex_engine
        run: |
          $ErrorActionPreference = "Stop"
          echo '{"type": "chat", "content": "test"}' | .\dist\kyrex-engine.exe
        continue-on-error: true

      - name: Upload raw engine binary for isolated testing
        uses: actions/upload-artifact@v4
        with:
          name: raw-engine-exe
          path: kyrex_engine/dist/kyrex-engine.exe

      - name: Copy engine binary into Tauri sidecar location
        run: |
          mkdir -p kyrex-ide/src-tauri/binaries
          copy kyrex_engine\dist\kyrex-engine.exe kyrex-ide\src-tauri\binaries\kyrex-engine-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: kyrex-ide
        run: npm install

      - name: Build Tauri app
        working-directory: kyrex-ide
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyrex-ide-windows
          path: |
            kyrex-ide/src-tauri/target/release/bundle/msi/*.msi
            kyrex-ide/src-tauri/target/release/bundle/nsis/*.exe
