name: Check integrated Android Chat
on:
  pull_request:
    paths: ['kyrex-chat-android/**', 'kyrex-health-android/**', 'kyrex-voice-android/**', 'kyrex-messages-pairing-android/**', 'kyrex-chat/**', 'kyrex-cloud/fitness_connections.py', 'kyrex-cloud/device_messages.py', 'kyrex-cloud/web/backend/**', '.github/workflows/check-android-chat.yml']
  push:
    branches: [main]
    paths: ['kyrex-chat-android/**', 'kyrex-health-android/**', 'kyrex-voice-android/**', 'kyrex-messages-pairing-android/**', 'kyrex-chat/**', 'kyrex-cloud/fitness_connections.py', 'kyrex-cloud/device_messages.py', 'kyrex-cloud/web/backend/**', '.github/workflows/check-android-chat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36-ext19' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Test and bind existing Messages protocol adapter
        working-directory: kyrex-messages-pairing-android/bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go mod tidy
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64 -androidapi=28 -o ../app/libs/pairbridge.aar .
      - name: Prepare verified offline Voice assets
        run: python3 kyrex-voice-android/prepare_assets.py
      - name: Prepare retained signing key for installable APK
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KYREX_CHAT_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            echo '::warning title=Android signing not configured::Tests will run, but no installable APK will be published. Configure KYREX_CHAT_ANDROID_KEYSTORE_B64 with a retained signing key; see kyrex-chat-android/SIGNING.md.'
            echo '### Android checks only — no installable APK' >> "$GITHUB_STEP_SUMMARY"
            echo 'A retained signing key is not configured. Temporary debug keys cannot provide compatible app updates. Configure KYREX_CHAT_ANDROID_KEYSTORE_B64 as described in kyrex-chat-android/SIGNING.md, then build again.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          signing_file="$RUNNER_TEMP/kyrex-chat-signing.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$signing_file"
          keytool -list -keystore "$signing_file" -storepass android -alias androiddebugkey > /dev/null
          printf 'KYREX_CHAT_ANDROID_KEYSTORE=%s\n' "$signing_file" >> "$GITHUB_ENV"
          printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          echo '### Android APK uses the retained signing key' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compare signing-fingerprint.txt with your installed build before assuming an in-place update is possible. See kyrex-chat-android/SIGNING.md for migration and recovery.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test, lint and assemble integrated app
        working-directory: kyrex-chat-android
        env:
          # Public deployment configuration. The app contains no user secret.
          KYREX_CHAT_ORIGIN: ${{ vars.KYREX_ANDROID_CHAT_ORIGIN || 'https://chat.kyrex.dev' }}
        run: gradle --no-daemon -PkyrexChatOrigin="$KYREX_CHAT_ORIGIN" :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Record public signing fingerprint
        if: steps.signing.outputs.configured == 'true'
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          folder = Path('kyrex-chat-android/app/build/outputs/apk/debug')
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/apksigner'
          result = subprocess.check_output([str(signer), 'verify', '--print-certs', str(folder/'app-debug.apk')], text=True)
          value = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})', result).group(1).upper()
          (folder/'signing-fingerprint.txt').write_text(':'.join(value[i:i+2] for i in range(0, 64, 2))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kyrex-Chat-Android-checks
          path: |
            kyrex-chat-android/app/build/reports/
            kyrex-chat-android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: Kyrex-Chat-Android-v0.5
          path: |
            kyrex-chat-android/app/build/outputs/apk/debug/app-debug.apk
            kyrex-chat-android/app/build/outputs/apk/debug/signing-fingerprint.txt
          retention-days: 14
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend
      KYREX_DATA_DIR: /tmp/kyrex-android-chat-checks
      WEB_SESSION_SECRET: android-chat-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn cryptography playwright google-api-python-client google-auth-oauthlib google-auth-httplib2 google-cloud-firestore
      - name: Check native grants and existing Health, auth and booking import
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_android_chat_health.py
          kyrex-cloud/web/backend/test_android_native_grants.py
          kyrex-cloud/web/backend/test_fitness_api.py
          kyrex-cloud/test_fitness_connections.py
          kyrex-cloud/web/backend/test_web_sessions.py
          kyrex-cloud/web/backend/test_oauth_state.py
          kyrex-cloud/web/backend/test_bearer_auth.py
          kyrex-cloud/web/backend/test_member_bookings_flow.py
          kyrex-cloud/web/backend/test_voice_api.py
          kyrex-cloud/web/backend/test_unified_voice.py
          kyrex-cloud/web/backend/test_device_messages.py
          kyrex-cloud/web/backend/test_messages_send.py
          kyrex-cloud/web/backend/test_messages_presence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kyrex-chat/package-lock.json
      - name: Check Health setup and shared Chat UI
        working-directory: kyrex-chat
        run: |
          npm ci
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs tests/androidHealth.test.mjs
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs tests/messagesGuidedSetup.test.mjs
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs tests/messagesStatus.test.mjs
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs tests/messagesConnector.test.mjs
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs tests/connectionsHub.test.mjs
          npm run build
