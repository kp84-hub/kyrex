name: Build Messages Android test
on:
  pull_request:
    paths: ['kyrex-messages-android/**', '.github/workflows/build-messages-android.yml']
  push:
    branches: [main, 'feat/native-messages-probe']
    paths: ['kyrex-messages-android/**', '.github/workflows/build-messages-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: kyrex-messages-android
      - uses: actions/upload-artifact@v4
        with:
          name: Kyrex-Messages-Test
          path: kyrex-messages-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
