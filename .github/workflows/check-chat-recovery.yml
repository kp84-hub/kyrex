name: Check Chat recovery
on:
  pull_request:
    paths:
      - 'kyrex-chat/**'
      - 'kyrex-desktop/src/**'
      - '.github/workflows/check-chat-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: kyrex-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kyrex-chat/package-lock.json
      - run: npm ci
      - name: Check interrupted tasks, saved replies, and confirmed sends
        run: >-
          node --import ./dev/jsx-loader-register.mjs --import ./tests/jsdomSetup.mjs --test
          ./tests/chatControls.test.mjs
          ./tests/visionImages.test.mjs
          ./tests/workspaceConversationScope.test.mjs
          ./tests/taskConnectionRecovery.test.mjs ./tests/interruptedChat.test.mjs
          ./tests/workoutBookingConnectionRecovery.test.mjs
          ./tests/transcript.test.mjs ./tests/transcriptFocusRefresh.test.mjs
          ./tests/researchCompletionRefresh.test.mjs ./tests/messageProgress.test.mjs
          ./tests/developerProgress.test.mjs ./tests/resultPreview.test.mjs ./tests/delegatedApprove.test.mjs
          ./tests/delegatedLiveProgress.test.mjs
          ./tests/liveActivityProgress.test.mjs ./tests/activeWork.test.mjs
          ./tests/delegationConversations.test.mjs
          ./tests/workoutPreviewSend.test.mjs ./tests/messagesSend.test.mjs ./tests/emailSend.test.mjs
          ./tests/level6PreviewRunNow.test.mjs
          ./tests/emailInboxConnection.test.mjs ./tests/connectionsHub.test.mjs ./tests/connectionsConsent.test.mjs
          ./tests/remoteMCP.test.mjs ./tests/composioApps.test.mjs
          ./tests/voiceConnection.test.mjs ./tests/voiceClient.test.mjs ./tests/voiceFollowUp.test.mjs
          ./tests/voiceSpeechPlayback.test.mjs
          ./tests/voiceInterrupt.test.mjs
          ./tests/voiceHandoff.test.mjs ./tests/voiceControls.test.mjs ./tests/onboarding.test.mjs ./tests/botModelCheck.test.mjs
          ./tests/botRosterRefresh.test.mjs
          ./tests/providerProfileEdit.test.mjs
          ./tests/privacySettings.test.mjs ./tests/trainerMonitorSettings.test.mjs
          ./tests/messageSelection.test.mjs ./tests/developerRepository.test.mjs ./tests/githubConnect.test.mjs
          ./tests/chatRepository.test.mjs
          ./tests/workoutReport.test.mjs ./tests/sleepReport.test.mjs
          ./tests/notifications.test.mjs
      - name: Install Chromium for native transcript selection checks
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Check native selection and clipboard through the rendered transcript
        run: node tests/messageSelection.browser.mjs
      - run: npm run build
      - name: Check actual browser notification delivery and conversation links
        run: xvfb-run -a node tests/notifications.browser.mjs
      - name: Check Kbot gestures, compact inbox, flight poses and reduced motion
        run: node tests/kbotNotifications.browser.mjs
      - name: Check image uploads in Kbot, phone and desktop layouts
        run: node tests/visionImages.browser.mjs

