name: Check Android voice
on:
  pull_request:
    paths: ['kyrex-voice-android/**', 'kyrex-cloud/voice_devices.py', 'kyrex-cloud/web/backend/voice_api.py', 'kyrex-cloud/web/backend/test_voice_api.py', '.github/workflows/build-voice-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check scoped voice credentials and Chat routing
        run: |
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn cryptography websockets
          python -m pytest --confcutdir=kyrex-cloud/web/backend -q kyrex-cloud/web/backend/test_voice_api.py
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {log-accepted-android-sdk-licenses: false, packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Fetch verified offline wake assets
        id: assets
        run: python kyrex-voice-android/prepare_assets.py
      - name: Exercise the shipped wake model
        run: |
          python -m pip install sherpa-onnx==1.13.8 soundfile piper-tts==1.8.0
          python kyrex-voice-android/validate_wake.py
      - name: Test lifecycle, lint and build phone app
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        working-directory: kyrex-voice-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyrex-voice-test-reports
          path: |
            kyrex-voice-android/app/build/reports/
            kyrex-voice-android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Kyrex-Voice-v0.2
          path: kyrex-voice-android/app/build/outputs/apk/debug/app-debug.apk
