name: Check Chat notifications
on:
  pull_request:
    paths:
      - 'kyrex-cloud/chat_notifications.py'
      - 'kyrex-cloud/task_store.py'
      - 'kyrex-cloud/web/backend/notification_api.py'
      - 'kyrex-cloud/web/backend/main.py'
      - 'kyrex-cloud/web/backend/test_notifications.py'
      - '.github/workflows/check-chat-notifications.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend
      KYREX_DATA_DIR: /tmp/kyrex-notification-checks
      WEB_SESSION_SECRET: notification-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn cryptography pywebpush==2.1.2
          playwright google-api-python-client google-auth-oauthlib google-auth-httplib2 google-cloud-firestore
      - name: Check notification ownership, consent, recovery and real push encryption offline
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_notifications.py
          kyrex-cloud/web/backend/test_web_sessions.py
      - name: Check existing durable task lifecycle and Flux replay
        run: |
          python kyrex-cloud/test_task_lifecycle.py
          python kyrex-cloud/test_flux.py
