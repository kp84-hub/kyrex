name: Check account onboarding
on:
  pull_request:
    paths:
      - 'kyrex-cloud/web/backend/**'
      - 'kyrex-chat/**'
      - '.github/workflows/check-accounts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend
      KYREX_DATA_DIR: /tmp/kyrex-account-checks
      WEB_SESSION_SECRET: account-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn cryptography
          pywebpush==2.1.2 google-api-python-client google-auth-oauthlib
          google-auth-httplib2 google-cloud-firestore playwright
      - name: Check account boundaries and existing browser and native sign-in
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_universal_accounts.py
          kyrex-cloud/web/backend/test_oauth_state.py
          kyrex-cloud/web/backend/test_desktop_oauth.py
          kyrex-cloud/web/backend/test_bearer_auth.py
          kyrex-cloud/web/backend/test_web_sessions.py
          kyrex-cloud/web/backend/test_chat_onboarding.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kyrex-chat/package-lock.json
      - run: npm ci
        working-directory: kyrex-chat
      - name: Check account and existing provider onboarding
        working-directory: kyrex-chat
        run: >-
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs --test
          tests/accountOnboarding.test.mjs tests/onboarding.test.mjs
          tests/providerProfileEdit.test.mjs tests/chatControls.test.mjs
      - run: npm run build
        working-directory: kyrex-chat
      - name: Install browser for account layout checks
        working-directory: kyrex-chat
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Check built welcome and managed screens in Chromium
        working-directory: kyrex-chat
        run: node tests/accountOnboarding.browser.mjs
