name: Build Messages pairing test
on:
  pull_request:
    paths: ['kyrex-messages-pairing-android/**', '.github/workflows/build-messages-pairing-android.yml']
  push:
    branches: [main, 'feat/messages-protocol-pairing-test']
    paths: ['kyrex-messages-pairing-android/**', '.github/workflows/build-messages-pairing-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: messages-pairing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Test and bind the Go protocol adapter
        working-directory: kyrex-messages-pairing-android/bridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go mod tidy
          go test ./...
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64 -androidapi=28 -o ../app/libs/pairbridge.aar .
      - name: Test, lint and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: kyrex-messages-pairing-android
      - name: Report Android test results
        if: always()
        run: |
          python - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob('kyrex-messages-pairing-android/app/build/test-results/testDebugUnitTest/TEST-*.xml')):
              root = ET.parse(path).getroot()
              print(root.attrib['name'], 'tests=' + root.attrib['tests'], 'failures=' + root.attrib['failures'], 'errors=' + root.attrib['errors'])
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kyrex-Messages-Companion-checks
          path: |
            kyrex-messages-pairing-android/app/build/reports/tests/testDebugUnitTest/
            kyrex-messages-pairing-android/app/build/test-results/testDebugUnitTest/
            kyrex-messages-pairing-android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Kyrex-Messages-Companion-Test-v0.9
          path: kyrex-messages-pairing-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
