name: Check conversational bookings
on:
  pull_request:
    paths:
      - 'kyrex-cloud/**'
      - 'browser-host/**'
      - '.github/workflows/check-booking-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-browser-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            dockerfile: browser-host/Dockerfile
          - image: viewer
            dockerfile: browser-host/Dockerfile.viewer
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual private browser runtime
        run: docker build -f ${{ matrix.dockerfile }} -t kyrex-session-image .
      - name: Verify private reconnect start and encryption in the built image
        run: >-
          docker run --rm --entrypoint python3 kyrex-session-image -c
          "import tempfile; from pathlib import Path;
          import browser_reconnect, browser_reconnect_contract, browser_operator;
          from cryptography.fernet import Fernet;
          from browser_session_cookies import SessionCookies;
          from types import SimpleNamespace;
          p=Path(tempfile.mkdtemp());
          k=SessionCookies(p,SimpleNamespace(cookies=lambda: []));
          k.save(force=True); assert k.restore()==0;
          command={'request_id':'a'*32,'owner':'image-fixture','bot_id':'fixture-bot',
          'action':'start','lease':'','url':'https://example.com'};
          calls=[];
          supervisor=browser_reconnect.Supervisor('image-fixture',
          'https://fixture.tail.ts.net/vnc.html',p,
          spawn=lambda *a,**kw: calls.append((a,kw)) or SimpleNamespace(poll=lambda:None));
          result=supervisor.handle(command);
          assert result['state']=='starting' and len(calls)==1;
          assert calls[0][1]['env']['KYREX_VIEWER_OWNER']=='image-fixture'"
      - name: Verify real profile-owner workers and Chrome handoff in the agent image
        if: matrix.image == 'agent'
        run: >-
          docker run --rm --entrypoint python3
          -e PYTHONPATH=/host -e KYREX_TEST_PROFILE_IDENTITY_BROWSER=1
          -v "$PWD/browser-host/test_profile_identity.py:/tmp/test_profile_identity.py:ro"
          kyrex-session-image /tmp/test_profile_identity.py -v
  bookings:
    runs-on: ubuntu-24.04
    # Match the installed package to a fixed browser image; retain every real
    # browser test without a runner-dependent apt/browser installation.
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
      options: --init --ipc=host
    timeout-minutes: 30
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend:browser-host
      WEB_SESSION_SECRET: booking-workflow-ci-only
      KYREX_TEST_BROWSER: '1'
      KYREX_TEST_VIEWER_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: >-
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn websockets
          cryptography playwright==1.55.0 google-api-python-client google-auth-oauthlib
          google-auth-httplib2 google-cloud-firestore
          pyyaml
      - name: Verify class intent and clarification through native Chat
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_browser_session_diagnostics.py
          kyrex-cloud/test_browser_session_cookies.py
          browser-host/test_browser_reconnect.py
          kyrex-cloud/web/backend/test_browser_diagnostics_api.py
          kyrex-cloud/web/backend/test_workout_booking_chat.py
          kyrex-cloud/web/backend/test_booking_chat.py
      - name: Verify real private sign-in across restarts and controller crash
        run: >-
          xvfb-run -a python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          browser-host/test_session_cookie_handoff.py
      - name: Verify actual intercepted browser forms and owner confirmation
        run: >-
          xvfb-run -a python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_booking_chat.py
          kyrex-cloud/web/backend/test_workout_booking_chat.py
          kyrex-cloud/web/backend/test_member_bookings_flow.py
          kyrex-cloud/web/backend/test_browser_diagnostics_api.py
          kyrex-cloud/web/backend/test_workout_class_reader.py
          browser-host/test_booking_driver.py
          browser-host/test_workout_booking_driver.py
          browser-host/test_member_bookings_driver.py
          browser-host/test_browser_diagnostic_driver.py
          browser-host/test_glofox_session.py
          browser-host/test_browser_profile_storage.py
          kyrex-cloud/test_browser_operator_managed.py
          kyrex-cloud/web/backend/test_email_identity.py
          kyrex-cloud/test_browser_host_channel.py
          kyrex-cloud/test_browser_host_bridge.py
          kyrex-cloud/test_browser_operator.py
          browser-host/test_agent.py
          browser-host/test_agent_manual_fail_closed.py
          browser-host/test_viewer.py
          browser-host/test_viewer_lock.py
          browser-host/test_viewer_handoff.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify browser diagnostics in Connections
        working-directory: kyrex-chat
        run: |
          npm ci --no-audit --no-fund
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs --test tests/browserConnection.test.mjs tests/privateBrowserReconnect.test.mjs tests/connectionsHub.test.mjs tests/connectionsConsent.test.mjs
          npm run build
