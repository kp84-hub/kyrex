name: Check conversational bookings
on:
  pull_request:
    paths:
      - 'kyrex-cloud/**'
      - 'browser-host/**'
      - '.github/workflows/check-booking-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bookings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: kyrex-cloud:kyrex-cloud/web/backend:browser-host
      WEB_SESSION_SECRET: booking-workflow-ci-only
      KYREX_TEST_BROWSER: '1'
      KYREX_TEST_VIEWER_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: >-
          python -m pip install ./kyrex_engine pytest httpx fastapi uvicorn websockets
          cryptography playwright google-api-python-client google-auth-oauthlib
          google-auth-httplib2 google-cloud-firestore
          pyyaml
      - name: Verify class intent and clarification through native Chat
        run: >-
          python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/test_browser_session_diagnostics.py
          kyrex-cloud/test_browser_session_cookies.py
          browser-host/test_browser_reconnect.py
          kyrex-cloud/web/backend/test_workout_booking_chat.py
          kyrex-cloud/web/backend/test_booking_chat.py
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual intercepted browser forms and owner confirmation
        run: >-
          xvfb-run -a python -m pytest -p offline_tests --confcutdir=kyrex-cloud/web/backend -q
          kyrex-cloud/web/backend/test_booking_chat.py
          kyrex-cloud/web/backend/test_workout_booking_chat.py
          kyrex-cloud/web/backend/test_member_bookings_flow.py
          kyrex-cloud/web/backend/test_browser_diagnostics_api.py
          kyrex-cloud/web/backend/test_workout_class_reader.py
          browser-host/test_booking_driver.py
          browser-host/test_workout_booking_driver.py
          browser-host/test_member_bookings_driver.py
          browser-host/test_browser_diagnostic_driver.py
          browser-host/test_glofox_session.py
          browser-host/test_browser_profile_storage.py
          browser-host/test_session_cookie_handoff.py
          kyrex-cloud/test_browser_operator_managed.py
          kyrex-cloud/web/backend/test_email_identity.py
          kyrex-cloud/test_browser_host_channel.py
          kyrex-cloud/test_browser_host_bridge.py
          kyrex-cloud/test_browser_operator.py
          browser-host/test_agent.py
          browser-host/test_agent_manual_fail_closed.py
          browser-host/test_viewer.py
          browser-host/test_viewer_lock.py
          browser-host/test_viewer_handoff.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify browser diagnostics in Connections
        working-directory: kyrex-chat
        run: |
          npm ci --no-audit --no-fund
          node --import ./tests/jsdomSetup.mjs --import ./dev/jsx-loader-register.mjs --test tests/browserConnection.test.mjs tests/privateBrowserReconnect.test.mjs tests/connectionsHub.test.mjs tests/connectionsConsent.test.mjs
          npm run build
