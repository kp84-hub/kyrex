# browser-host/docker-compose.cloud.yml - PHASE 2: CLOUD CONNECTIVITY.
#
# Deliberately a SEPARATE file from docker-compose.yml. The Phase-1 stack has
# no Cloud channel by construction; adding this file (and its `agent` service)
# is the ONLY way a host reaches Cloud, so a Phase-1 machine can never do so by
# accident. The two stacks may share the same ./profiles volume - the agent
# reuses the same per-(owner, bot) profile directories.
#
# The agent DIALS OUT to Cloud over an authenticated websocket. It opens NO
# listening port and never exposes CDP: Chromium's DevTools endpoint stays on
# loopback inside the container, unpublished.
#
#   KYREX_HOST_ID=... \
#   KYREX_HOST_OWNER=... \
#   KYREX_HOST_CLOUD_URL=wss://cloud.example/browser-host \
#   KYREX_HOST_ENROLLMENT_SECRET=... \
#   KYREX_HOST_ALLOWLIST=example.com,example.org \
#     docker compose -f browser-host/docker-compose.cloud.yml --profile cloud \
#       up -d agent
#
# There is intentionally NO `ports:` mapping on any service here.
services:
  agent:
    build:
      context: ..
      dockerfile: browser-host/Dockerfile
    image: kyrex-browser-host:phase1
    entrypoint:
      - tini
      - --
      - sh
      - -c
      - "Xvfb :99 -screen 0 1280x800x24 -nolisten tcp & python3 /host/messages_watcher.py & exec python3 /host/agent.py"
    volumes:
      - ./profiles:/profiles
    environment:
      # Enrollment identity + secret. The secret is an HMAC key: it proves
      # possession and never travels on the wire.
      KYREX_HOST_ID: "${KYREX_HOST_ID:?set KYREX_HOST_ID}"
      KYREX_HOST_OWNER: "${KYREX_HOST_OWNER:?set KYREX_HOST_OWNER}"
      KYREX_HOST_CLOUD_URL: "${KYREX_HOST_CLOUD_URL:?set KYREX_HOST_CLOUD_URL}"
      KYREX_HOST_ENROLLMENT_SECRET: "${KYREX_HOST_ENROLLMENT_SECRET:?set KYREX_HOST_ENROLLMENT_SECRET}"
      # The HOST'S OWN allowlist (defense in depth, intersected with Cloud's).
      KYREX_HOST_ALLOWLIST: "${KYREX_HOST_ALLOWLIST:-}"
      # Host-local fixed destination. Never sent to Cloud or stored in a task.
      KYREX_GOOGLE_MESSAGES_CONVERSATION_URL: "${KYREX_GOOGLE_MESSAGES_CONVERSATION_URL:-}"
      KYREX_MESSAGES_BOT_ID: "${KYREX_MESSAGES_BOT_ID:-calendar}"
      KYREX_BROWSER_PROFILES_ROOT: /profiles
      # The SHARED lock/state dir — the SAME path the viewer container uses,
      # on the shared ./profiles volume. The agent takes the SAME per-(owner,
      # bot) flock the manual viewer takes, so the two can never run one
      # profile and the viewer's session is visible to the agent.
      KYREX_VIEWER_STATE_DIR: /profiles/.kyrex-viewer-state
      KYREX_BROWSER_DRIVER: playwright
      KYREX_BROWSER_EXECUTABLE: /usr/bin/chromium
      # Google Messages refuses its paired session in Chromium's headless
      # mode. Xvfb supplies a private, non-networked display; there is still
      # no VNC, published port, or owner-visible automation surface.
      DISPLAY: ":99"
      KYREX_BROWSER_HEADLESS: "0"
    restart: unless-stopped
    # Failed heartbeat/reconnect: the agent backs off and re-registers itself;
    # an unauthenticated connection is refused by Cloud and retried.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /host/agent.py >/dev/null && pgrep -f /host/messages_watcher.py >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["cloud"]
