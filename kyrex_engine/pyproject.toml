[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kyrex-engine"
version = "0.1.0"
description = "Kyrex — minimalist terminal agent toolkit"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "requests>=2.28.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.14"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
kyrex = "kyrex.cli:main"

[tool.setuptools.package-data]
kyrex = ["assets/*.json"]
